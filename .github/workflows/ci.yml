name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check generated API surface
        run: npm run api:check

      - name: Lint for n8n Cloud compatibility
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Inspect the npm package
        run: npm pack --dry-run
