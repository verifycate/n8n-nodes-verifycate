# Publishes the package to npm on every version tag.
#
# n8n requires community nodes submitted for verification to be published from
# GitHub Actions with an npm provenance statement. Provenance lets anyone verify
# that a package was built by this workflow, from this repository and commit.
#
# One-time setup (recommended, no long-lived secret):
#   1. On npmjs.com, open the package settings.
#   2. Under Publish access → Trusted Publishers, add a GitHub Actions publisher.
#   3. Repository owner: verifycate
#      Repository name:  n8n-nodes-verifycate
#      Workflow name:    publish.yml
#   4. Leave NPM_TOKEN unset. GitHub's OIDC token is used instead.
#
# Alternatively, add a granular npm access token as the NPM_TOKEN secret.
#
# Release process:
#   npm run release
# This lints, builds, bumps the version, updates the changelog, commits, tags,
# and pushes. The tag triggers this workflow.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
