# Publishes the package to npm on every version tag.
#
# n8n requires community nodes submitted for verification to be published from
# GitHub Actions with an npm provenance statement. This workflow uses npm
# Trusted Publishing, so no long-lived npm token is stored in the repository.
#
# One-time setup:
#   1. Publish the first version once (see docs/verification.md) so the npm
#      package exists.
#   2. On npmjs.com, open @verifycate/n8n-nodes-verifycate → Settings.
#   3. Under Publish access → Trusted Publishers, add a GitHub Actions publisher:
#        Repository owner: verifycate
#        Repository name:  n8n-nodes-verifycate
#        Workflow name:    publish.yml
#   4. Leave NPM_TOKEN unset. GitHub's OIDC token is used instead.
#
# Release process:
#   npm run release
# This lints, builds, bumps the version, updates the changelog, commits, tags,
# and pushes. The tag triggers this workflow to publish with provenance.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1+; Node 24 bundles npm 11.
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        # The node runtime ships prebuilt; native builds from n8n-workflow's
        # dev-only expression runtime are not needed for lint, build, or tests.
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run check

      - name: Release
        # In GitHub Actions, n8n-node release publishes with provenance enabled.
        run: npm run release
